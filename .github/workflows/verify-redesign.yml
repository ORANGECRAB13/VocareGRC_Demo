name: Verify Android and Pro

on:
  pull_request:
  push:
    branches: [voca-redesign-subscriptions]
  workflow_dispatch:

jobs:
  android-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run test:mobile
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run verify:www
      - run: npm run android:sync
      - name: Check native plugin wiring is committed
        run: git diff --exit-code -- android/app/capacitor.build.gradle android/capacitor.settings.gradle
      - name: Compile, test and lint Android
        working-directory: android
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-qa-unsigned-release
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.html
